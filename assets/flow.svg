<rect width="1500" height="560" fill="url(#bg)"/>
<text x="40" y="58" font-family="sans-serif" font-size="32" font-weight="bold" fill="#ffffff">How a request flows through markdown-memory-orca</text>
<text x="40" y="90" font-family="sans-serif" font-size="21" fill="#b2dcd6">Deterministic text processing — no extra LLM call. Memory files live under ~/memory.</text>
<rect x="40" y="130" width="320" height="120" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#4dd0c4" stroke-width="2"/><text x="62" y="174" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Markdown files</text><text x="62" y="212" font-family="sans-serif" font-size="19" fill="#c8c8d7">GLOBAL.md · CURRENT.md</text>
<rect x="480" y="130" width="320" height="120" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#4dd0c4" stroke-width="2"/><text x="502" y="174" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Build injection</text><text x="502" y="212" font-family="sans-serif" font-size="19" fill="#c8c8d7">resolve · filter roles · budget</text>
<rect x="920" y="130" width="540" height="120" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#4dd0c4" stroke-width="2"/><text x="942" y="174" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Model request</text><text x="942" y="212" font-family="sans-serif" font-size="19" fill="#c8c8d7">system prompt + stable block</text>
<rect x="40" y="350" width="320" height="120" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#38bdf8" stroke-width="2"/><text x="62" y="394" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">memory tool</text><text x="62" y="432" font-family="sans-serif" font-size="19" fill="#c8c8d7">save · update · read · search</text>
<rect x="480" y="350" width="320" height="120" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#38bdf8" stroke-width="2"/><text x="502" y="394" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">PROJECTS/&lt;slug&gt;/</text><text x="502" y="432" font-family="sans-serif" font-size="19" fill="#c8c8d7">CURRENT · HISTORY · ARCHIVE</text>
<rect x="920" y="350" width="540" height="120" rx="16" fill="#ffffff" fill-opacity="0.05" stroke="#38bdf8" stroke-width="2"/><text x="942" y="394" font-family="sans-serif" font-size="24" font-weight="bold" fill="#ffffff">Prompt cache</text><text x="942" y="432" font-family="sans-serif" font-size="19" fill="#c8c8d7">same block → cache hits</text>
