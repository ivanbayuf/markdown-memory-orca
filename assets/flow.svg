<line x1="800" y1="190" x2="908" y2="190" stroke="#4dd0c4" stroke-width="3" marker-end="url(#ah)"/>
<path d="M1400,250 L1400,300 L200,300 L200,338" fill="none" stroke="#4dd0c4" stroke-width="3" marker-end="url(#ah)"/>
<text x="1050" y="290" font-family="sans-serif" font-size="19" fill="#4dd0c4">model calls the memory tool</text>
<line x1="360" y1="410" x2="468" y2="410" stroke="#38bdf8" stroke-width="3" marker-end="url(#ah2)"/>
<line x1="800" y1="410" x2="908" y2="410" stroke="#38bdf8" stroke-width="3" marker-end="url(#ah2)"/>
