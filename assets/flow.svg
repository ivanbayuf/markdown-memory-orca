<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="560" role="img" aria-label="How a request flows through markdown-memory-orca">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#071827"/><stop offset="1" stop-color="#0e2f42"/></linearGradient>
<marker id="ah" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6 z" fill="#4dd0c4"/></marker>
