<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="450" viewBox="0 0 1500 450" role="img" aria-labelledby="t d"><title id="t">How markdown-memory-orca works</title><desc id="d">Project memory is resolved and filtered before a bounded block is injected in the model request; the memory tool supports explicit updates and retrieval.</desc><defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#13394a"/></linearGradient><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0 12 6 0 12z" fill="#5adbc6"/></marker></defs><rect width="1500" height="450" rx="26" fill="url(#b)"/><text x="70" y="70" fill="#91e8d7" font-family="Arial" font-size="22" font-weight="700" letter-spacing="3">REQUEST + WRITE PATH</text><g font-family="Arial"><g fill="#123749" stroke="#4a8990" stroke-width="2"><rect x="70" y="125" width="250" height="120" rx="18"/><rect x="430" y="125" width="270" height="120" rx="18"/><rect x="810" y="125" width="250" height="120" rx="18"/><rect x="1170" y="125" width="250" height="120" rx="18"/></g><g fill="#f3fbff" font-size="24" font-weight="700"><text x="105" y="175">Markdown files</text><text x="464" y="175">Resolve + filter</text><text x="846" y="175">Inject block</text><text x="1208" y="175">Model request</text></g><g fill="#b3cbd4" font-size="17"><text x="105" y="215">GLOBAL + CURRENT</text><text x="464" y="215">project · role · budget</text><text x="846" y="215">system prompt hook</text><text x="1208" y="215">stable prefix</text></g><path d="M320 185h100m280 0h100m260 0h100" stroke="#5adbc6" stroke-width="4" marker-end="url(#a)"/><rect x="430" y="310" width="270" height="90" rx="18" fill="#3a2f43" stroke="#ac83b4" stroke-width="2"/><text x="470" y="350" fill="#fff5ff" font-size="22" font-weight="700">memory tool</text><text x="470" y="380" fill="#dac7e0" font-size="17">save · update · read · search</text><path d="M565 310v-55" stroke="#c6a6d0" stroke-width="3" marker-end="url(#a)"/><text x="810" y="365" fill="#afc6cf" font-size="18">Deterministic file operations; no extra LLM call</text></g></svg>
