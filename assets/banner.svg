<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="560" viewBox="0 0 1600 560" role="img" aria-labelledby="t d"><title id="t">markdown-memory-orca — shared memory for coding agents</title><desc id="d">Durable Markdown project memory flowing into a compact agent request context.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071827"/><stop offset="1" stop-color="#12364a"/></linearGradient></defs><rect width="1600" height="560" rx="32" fill="url(#bg)"/><circle cx="1330" cy="170" r="190" fill="#29b8b0" opacity=".12"/><text x="100" y="150" fill="#84e7d3" font-family="Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="5">OPENCODE · MARKDOWN MEMORY</text><text x="100" y="250" fill="#f4fbff" font-family="Arial,sans-serif" font-size="72" font-weight="700">Shared memory.</text><text x="100" y="332" fill="#f4fbff" font-family="Arial,sans-serif" font-size="72" font-weight="700">Less reorientation.</text><text x="104" y="400" fill="#b8ced8" font-family="Arial,sans-serif" font-size="26">Durable project state, available before each model request.</text><g transform="translate(1090 115)"><rect width="300" height="330" rx="24" fill="#0d2838" stroke="#3b7c83" stroke-width="2"/><text x="32" y="53" fill="#8ce6d5" font-family="monospace" font-size="17">~/memory/PROJECTS</text><rect x="30" y="83" width="240" height="48" rx="10" fill="#173c4c"/><text x="48" y="114" fill="#e7f8f8" font-family="monospace" font-size="18">CURRENT.md</text><rect x="30" y="147" width="240" height="48" rx="10" fill="#173c4c"/><text x="48" y="178" fill="#e7f8f8" font-family="monospace" font-size="18">HISTORY.md</text><path d="M150 211v38m-10-12 10 12 10-12" fill="none" stroke="#72e2cd" stroke-width="4"/><rect x="30" y="256" width="240" height="48" rx="10" fill="#1f635e"/><text x="48" y="287" fill="#f3fffc" font-family="monospace" font-size="18">compact context</text></g></svg>
